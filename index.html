
<!DOCTYPE html>
<html>
<head>
    <title>Calculator</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <button id="toggleBtn" onclick="toggleForm()">Show / Hide Form</button>
    <div class="calculator-form" id="calculationForm">

        <input type="number" id="num1" placeholder="Enter number 1"><br>

        <input type="number" id="num2" placeholder="Enter number 2"><br>


        <button onclick="toggleOperators()">Operators</button>
        <div id="operatorButtons" class="operatpr-buttons">
        <button id="addBtn" onclick="calculate('+')" disable>add(+)</button>
        <button id="subtractBtn" onclick="calculate('-')" disable>substract(-)</button>
        <button id="multiplyBtn" onclick="calculate('*')" disable>multiply(*)</button>
        <button id="divisionBtn" onclick="calculate('/')" disable>division(/)</button>
        </div>
        <div id="result"></div>

    </div>

   <script src="Calculations.js"></script>

</body>
</html>
