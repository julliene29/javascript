
<!DOCTYPE html>
<html>
<head>
    <title>Calculator</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <button id="toggleBtn" onclick="toggleForm()">Show / Hide Form</button>
    <div class="calculator-form" id="calculationForm">

        <input type="number" id="num1" placeholder="Enter number 1">

        <input type="number" id="num2" placeholder="Enter number 2">
        <button onclick="toggleOperators()">Operators</button>
        <div id="operatorButtons" class="operator-buttons">
            <button onclick="calculate('+')" disabled>Add (+)</button>
            <button onclick="calculate('-')" disabled>Subtract (-)</button>
            <button onclick="calculate('*')" disabled>Multiply (*)</button>
            <button onclick="calculate('/')" disabled>Divide (÷)</button>
        </div>
        <div id="result"></div>

    </div>

    <script src="Calculations.js"></script>

</body>
</html>
